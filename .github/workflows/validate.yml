name: Validate

# A skill that breaks the Agent Skills spec is not an error anywhere: the spec
# tells clients to skip it and carry on, so the only symptom is a skill that is
# never called. This is where that becomes visible.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No setup-python step: the script is standard library only, and the
      # runner image already has a Python new enough for it.
      - run: python3 scripts/test_validate.py
      - run: python3 scripts/validate.py
